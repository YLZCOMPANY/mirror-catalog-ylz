  <style>
        body {
            box-sizing: border-box;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
        
        * {
            font-family: 'Vazirmatn', sans-serif;
        }
        
        .product-card {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(218, 165, 32, 0.3);
        }
        
        .product-image {
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image {
            transform: scale(1.05);
        }
        
        .cta-button {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
        }
        
        .cta-button:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(218, 165, 32, 0.4);
        }
        
        .header-gradient {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

  <script>
        const defaultConfig = {
            company_title: "آینه های خودرو",
            header_subtitle: "کیفیت برتر، قیمت مناسب",
            promo_title: "چرا آینه های ما را انتخاب کنید؟",
            feature_1_title: "کیفیت اصل",
            feature_1_text: "محصولات اورجینال با گارانتی کیفیت",
            feature_2_title: "قیمت مناسب",
            feature_2_text: "بهترین قیمت در بازار را از ما بخواهید",
            feature_3_title: "ارسال سریع",
            feature_3_text: "ارسال به سراسر کشور با بسته‌بندی مطمئن",
            promo_description: "ما با بیش از ۱۰ سال تجربه در زمینه قطعات خودرو، بهترین و باکیفیت‌ترین آینه‌های بغل خودرو را برای انواع برندهای داخلی و خارجی ارائه می‌دهیم. تمامی محصولات ما دارای گارانتی اصالت و کیفیت هستند.",
            phone_number: "09103012969",
            button_text: "تماس بگیرید",
            product_1_title: "آینه JAC J4",
            product_2_title: "آینه JAC S3",
            product_3_title: "آینه CERATO",
            product_4_title: "آینه BRILLIANCE",
            product_5_title: "آینه SAINA/QUIK",
            product_6_title: "آینه KMC T8",
            background_color: "#0a0a0a",
            card_background: "#1a1a1a",
            primary_gold: "#FFD700",
            secondary_gold: "#DAA520",
            text_color: "#ffffff",
            font_family: "Vazirmatn",
            font_size: 16
        };

        async function onConfigChange(config) {
            const companyTitle = config.company_title || defaultConfig.company_title;
            const headerSubtitle = config.header_subtitle || defaultConfig.header_subtitle;
            const promoTitle = config.promo_title || defaultConfig.promo_title;
            const feature1Title = config.feature_1_title || defaultConfig.feature_1_title;
            const feature1Text = config.feature_1_text || defaultConfig.feature_1_text;
            const feature2Title = config.feature_2_title || defaultConfig.feature_2_title;
            const feature2Text = config.feature_2_text || defaultConfig.feature_2_text;
            const feature3Title = config.feature_3_title || defaultConfig.feature_3_title;
            const feature3Text = config.feature_3_text || defaultConfig.feature_3_text;
            const promoDescription = config.promo_description || defaultConfig.promo_description;
            const phoneNumber = config.phone_number || defaultConfig.phone_number;
            const buttonText = config.button_text || defaultConfig.button_text;
            const bgColor = config.background_color || defaultConfig.background_color;
            const cardBg = config.card_background || defaultConfig.card_background;
            const primaryGold = config.primary_gold || defaultConfig.primary_gold;
            const secondaryGold = config.secondary_gold || defaultConfig.secondary_gold;
            const textColor = config.text_color || defaultConfig.text_color;
            const fontFamily = config.font_family || defaultConfig.font_family;
            const fontSize = config.font_size || defaultConfig.font_size;

            // Update text content
            document.getElementById('companyTitle').textContent = companyTitle;
            document.getElementById('headerSubtitle').textContent = headerSubtitle;
            document.getElementById('promoTitle').textContent = promoTitle;
            document.getElementById('feature1Title').textContent = feature1Title;
            document.getElementById('feature1Text').textContent = feature1Text;
            document.getElementById('feature2Title').textContent = feature2Title;
            document.getElementById('feature2Text').textContent = feature2Text;
            document.getElementById('feature3Title').textContent = feature3Title;
            document.getElementById('feature3Text').textContent = feature3Text;
            document.getElementById('promoDescription').textContent = promoDescription;
            
            for (let i = 1; i <= 6; i++) {
                const titleKey = `product_${i}_title`;
                const titleElement = document.getElementById(`product${i}Title`);
                if (titleElement) {
                    titleElement.textContent = config[titleKey] || defaultConfig[titleKey];
                }
                
                const buttonElement = document.getElementById(`buttonText${i}`);
                if (buttonElement) {
                    buttonElement.textContent = buttonText;
                }
            }

            // Update phone links
            const phoneLinks = document.querySelectorAll('a[href^="tel:"]');
            phoneLinks.forEach(link => {
                link.href = `tel:${phoneNumber}`;
            });

            // Update footer phone
            const footerPhone = document.querySelector('footer a');
            if (footerPhone) {
                footerPhone.textContent = `📞 ${phoneNumber}`;
            }

            // Apply colors
            document.body.style.background = `linear-gradient(to bottom, ${bgColor}, ${cardBg})`;
            document.querySelector('header').style.borderColor = secondaryGold;
            document.getElementById('companyTitle').style.color = primaryGold;
            document.getElementById('headerSubtitle').style.color = secondaryGold;
            
            document.querySelectorAll('.product-card').forEach(card => {
                card.style.background = `linear-gradient(135deg, ${cardBg} 0%, #2d2d2d 100%)`;
                card.style.borderColor = secondaryGold;
            });

            document.querySelectorAll('.product-card h3').forEach(title => {
                title.style.color = primaryGold;
            });

            document.querySelectorAll('.cta-button').forEach(btn => {
                btn.style.background = `linear-gradient(135deg, ${secondaryGold} 0%, ${primaryGold} 100%)`;
            });

            document.querySelector('footer').style.borderColor = secondaryGold;
            document.querySelector('footer p').style.color = secondaryGold;
            document.querySelector('footer a').style.color = primaryGold;

            // Apply font
            document.body.style.fontFamily = `'${fontFamily}', sans-serif`;

            // Apply font sizes
            document.getElementById('companyTitle').style.fontSize = `${fontSize * 3.125}px`;
            document.getElementById('headerSubtitle').style.fontSize = `${fontSize * 1.25}px`;
            document.getElementById('promoTitle').style.fontSize = `${fontSize * 1.875}px`;
            document.getElementById('feature1Title').style.fontSize = `${fontSize * 1.25}px`;
            document.getElementById('feature1Text').style.fontSize = `${fontSize}px`;
            document.getElementById('feature2Title').style.fontSize = `${fontSize * 1.25}px`;
            document.getElementById('feature2Text').style.fontSize = `${fontSize}px`;
            document.getElementById('feature3Title').style.fontSize = `${fontSize * 1.25}px`;
            document.getElementById('feature3Text').style.fontSize = `${fontSize}px`;
            document.getElementById('promoDescription').style.fontSize = `${fontSize * 1.125}px`;
            document.querySelectorAll('.product-card h3').forEach(title => {
                title.style.fontSize = `${fontSize * 1.5}px`;
            });
            document.querySelectorAll('.cta-button').forEach(btn => {
                btn.style.fontSize = `${fontSize * 1.125}px`;
            });
            document.querySelector('footer p').style.fontSize = `${fontSize * 1.125}px`;
            document.querySelector('footer a').style.fontSize = `${fontSize * 1.5}px`;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [
                    {
                        get: () => config.background_color || defaultConfig.background_color,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ background_color: value });
                            }
                        }
                    },
                    {
                        get: () => config.card_background || defaultConfig.card_background,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ card_background: value });
                            }
                        }
                    },
                    {
                        get: () => config.primary_gold || defaultConfig.primary_gold,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ primary_gold: value });
                            }
                        }
                    },
                    {
                        get: () => config.secondary_gold || defaultConfig.secondary_gold,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ secondary_gold: value });
                            }
                        }
                    },
                    {
                        get: () => config.text_color || defaultConfig.text_color,
                        set: (value) => {
                            if (window.elementSdk) {
                                window.elementSdk.setConfig({ text_color: value });
                            }
                        }
                    }
                ],
                borderables: [],
                fontEditable: {
                    get: () => config.font_family || defaultConfig.font_family,
                    set: (value) => {
                        if (window.elementSdk) {
                            window.elementSdk.setConfig({ font_family: value });
                        }
                    }
                },
                fontSizeable: {
                    get: () => config.font_size || defaultConfig.font_size,
                    set: (value) => {
                        if (window.elementSdk) {
                            window.elementSdk.setConfig({ font_size: value });
                        }
                    }
                }
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["company_title", config.company_title || defaultConfig.company_title],
                ["header_subtitle", config.header_subtitle || defaultConfig.header_subtitle],
                ["promo_title", config.promo_title || defaultConfig.promo_title],
                ["feature_1_title", config.feature_1_title || defaultConfig.feature_1_title],
                ["feature_1_text", config.feature_1_text || defaultConfig.feature_1_text],
                ["feature_2_title", config.feature_2_title || defaultConfig.feature_2_title],
                ["feature_2_text", config.feature_2_text || defaultConfig.feature_2_text],
                ["feature_3_title", config.feature_3_title || defaultConfig.feature_3_title],
                ["feature_3_text", config.feature_3_text || defaultConfig.feature_3_text],
                ["promo_description", config.promo_description || defaultConfig.promo_description],
                ["phone_number", config.phone_number || defaultConfig.phone_number],
                ["button_text", config.button_text || defaultConfig.button_text],
                ["product_1_title", config.product_1_title || defaultConfig.product_1_title],
                ["product_2_title", config.product_2_title || defaultConfig.product_2_title],
                ["product_3_title", config.product_3_title || defaultConfig.product_3_title],
                ["product_4_title", config.product_4_title || defaultConfig.product_4_title],
                ["product_5_title", config.product_5_title || defaultConfig.product_5_title],
                ["product_6_title", config.product_6_title || defaultConfig.product_6_title]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }
    </script>
